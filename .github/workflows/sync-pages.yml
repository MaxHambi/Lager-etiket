name: Update GitHub Pages

# Baut die Web-App und synchronisiert Bundle/Assets/public auf gh-pages.
# pnpm-Monorepo: Quellen liegen in packages/web (seit etiket-Umbau).
on:
  push:
    branches:
      - master
    paths:
      - "packages/web/index.html"
      - "packages/web/src/**"
      - "packages/web/assets/**"
      - "packages/web/build.mjs"
      - "packages/web/public/**"
      - "packages/**"
      - "scripts/**"
      - "pnpm-lock.yaml"
      - "package.json"
      - "tsconfig.base.json"
      - ".github/workflows/sync-pages.yml"

# Erlaubnis geben, damit der Bot in den Branch schreiben darf
permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    # Environment des Secrets: APP_PASSWORD ist als Environment-Secret im
    # Environment "github-pages" hinterlegt (nicht als Repository-Secret).
    environment: github-pages
    steps:
      - name: Checkout Code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0 # Lädt alle Branches herunter, damit der Bot wechseln kann

      - name: pnpm installieren
        uses: pnpm/action-setup@v4

      - name: Node.js einrichten
        uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: "pnpm"

      - name: Abhängigkeiten installieren (Workspace)
        run: pnpm install --frozen-lockfile

      - name: HTML-Tool bauen (obuild + esbuild-Bundle)
        # Ist das Environment-Secret APP_PASSWORD gesetzt, wird der geschützte
        # Build erzeugt (Login-Overlay + AES-verschlüsseltes Bundle).
        # Ohne Secret: unverschlüsselter Entwicklungs-Build.
        env:
          APP_PASSWORD: ${{ secrets.APP_PASSWORD }}
        run: |
          if [ -n "$APP_PASSWORD" ]; then
            pnpm --filter @lager-etiket/web exec node build.mjs --password "$APP_PASSWORD"
          else
            pnpm --filter @lager-etiket/web build
          fi

      - name: Build-Artefakte sichern (dist ist nicht Teil von master)
        run: |
          cp -r packages/web/dist /tmp/app-dist
          cp -r packages/web/assets /tmp/app-assets
          # public/ (Vorlagen-Galerie + Config-Bibliothek) für gh-pages sichern
          cp -r packages/web/public /tmp/app-public

      - name: Dateien auf gh-pages synchronisieren
        run: |
          # Dem Bot eine Identität für Git geben
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          # Zum gh-pages branch wechseln
          git checkout -f gh-pages

          # Aktuelle Quelldateien aus dem Hauptbranch holen
          git checkout master -- packages/web/index.html
          mv packages/web/index.html index.html && rm -rf packages/web 2>/dev/null || true

          # Gebaute Dateien aus dem Job übernehmen (vor dem Branch-Wechsel gesichert)
          rm -rf assets dist public
          cp -r /tmp/app-assets assets
          cp -r /tmp/app-dist dist
          cp -r /tmp/app-public public

          # Prüfen, ob sich die Dateien überhaupt verändert haben
          # (-A: auch Löschungen werden gestaged)
          git add -A .
          if git diff --staged --quiet; then
            echo "Keine Änderungen zu synchronisieren."
          else
            git commit -m "Automatisches Update von index.html, assets und dist"
            git push origin gh-pages
          fi

  # Smoke-Check: nach dem Deploy die Kern-URLs der Live-Seite prüfen.
  # Schlägt einer fehl, ist die Pages-Seite kaputt — der Job wird rot.
  smoke-check:
    name: Pages-Smoke-Check (Live-URLs)
    runs-on: ubuntu-latest
    needs: sync
    steps:
      - name: Warten auf Pages-Deployment
        run: sleep 60

      - name: Kern-URLs prüfen (HTTP 200 erwartet)
        run: |
          BASE="https://maxhambi.github.io/Lager-etiket"
          FAIL=0
          for u in "" "dist/app.js" "public/templates/templates.json" "public/templates/MV.png" "public/configs/standard.json" "assets/css/themes/catppuccin-mocha.css"; do
            CODE=$(curl -s -o /dev/null -w "%{http_code}" "$BASE/$u")
            echo "$BASE/$u → $CODE"
            if [ "$CODE" != "200" ]; then FAIL=1; fi
          done
          # Altlasten müssen 404 liefern (Issue #18)
          for u in "packages/web/index.html" "public/compare/README.md"; do
            CODE=$(curl -s -o /dev/null -w "%{http_code}" "$BASE/$u")
            echo "$BASE/$u → $CODE (404 erwartet)"
            if [ "$CODE" != "404" ]; then FAIL=1; fi
          done
          if [ "$FAIL" = "1" ]; then
            echo "::error::Pages-Smoke-Check fehlgeschlagen — Kern-URL ohne 200 oder Altlast noch erreichbar."
            exit 1
          fi
          echo "Alle Kern-URLs erreichbar, Altlasten entfernt — Pages-Deploy verifiziert."
