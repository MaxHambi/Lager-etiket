name: Update GitHub Pages

# Wann soll die Action ausgeführt werden?
on:
  push:
    branches:
      - master # ACHTUNG: Falls dein Hauptbranch anders heißt, hier anpassen!
    paths:
      - 'index.html'
      - 'config.json'
      - 'src/**'
      - 'assets/**'
      - 'build.mjs'
      - 'tsconfig.json'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/sync-pages.yml'

# Erlaubnis geben, damit der Bot in den Branch schreiben darf
permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Lädt alle Branches herunter, damit der Bot wechseln kann

      - name: Node.js einrichten
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          # Kein npm-Cache möglich: package-lock.json ist in diesem Repo gitignored

      - name: Abhängigkeiten installieren
        # npm install statt npm ci, da package-lock.json in diesem Repo gitignored ist
        run: npm install --no-audit --no-fund

      - name: HTML-Tool bauen (Typecheck + Bundle)
        run: npm run build

      - name: Build-Artefakte sichern (dist ist nicht Teil von master)
        run: |
          cp -r dist /tmp/app-dist
          cp -r assets /tmp/app-assets

      - name: Dateien auf gh-pages synchronisieren
        run: |
          # Dem Bot eine Identität für Git geben
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          # Zum gh-pages branch wechseln
          git checkout gh-pages

          # Aktuelle Quelldateien aus dem Hauptbranch holen
          git checkout master -- index.html config.json

          # Gebaute Dateien aus dem Job übernehmen (vor dem Branch-Wechsel gesichert)
          rm -rf assets dist
          cp -r /tmp/app-assets assets
          cp -r /tmp/app-dist dist

          # Prüfen, ob sich die Dateien überhaupt verändert haben
          git add -A index.html config.json assets dist
          if git diff --staged --quiet; then
            echo "Keine Änderungen zu synchronisieren."
          else
            git commit -m "Automatisches Update von index.html, config.json, assets und dist"
            git push origin gh-pages
          fi
