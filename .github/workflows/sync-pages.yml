name: Update GitHub Pages

# Wann soll die Action ausgeführt werden?
on:
  push:
    branches:
      - master # ACHTUNG: Falls dein Hauptbranch anders heißt, hier anpassen!
    paths:
      - 'apps/web/index.html'
      - 'apps/web/src/**'
      - 'apps/web/assets/**'
      - 'apps/web/build.mjs'
      - 'packages/**'
      - 'scripts/**'
      - 'config.json'
      - 'packages/tools/config.json'
      - 'package.json'
      - 'package-lock.json'
      - 'turbo.json'
      - 'tsconfig.base.json'
      - '.github/workflows/sync-pages.yml'

# Erlaubnis geben, damit der Bot in den Branch schreiben darf
permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    # Environment des Secrets: APP_PASSWORD ist als Environment-Secret im
    # Environment "github-pages" hinterlegt (nicht als Repository-Secret).
    environment: github-pages
    steps:
      - name: Checkout Code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0 # Lädt alle Branches herunter, damit der Bot wechseln kann

      - name: Node.js einrichten
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: 'npm'

      - name: Abhängigkeiten installieren (alle Workspaces)
        run: npm ci --no-audit --no-fund

      - name: HTML-Tool bauen (Typecheck + Bundle via Turbo)
        # Ist das Environment-Secret APP_PASSWORD gesetzt, wird der geschützte
        # Build erzeugt (Login-Overlay + AES-verschlüsseltes Bundle).
        # Ohne Secret: unverschlüsselter Entwicklungs-Build.
        env:
          APP_PASSWORD: ${{ secrets.APP_PASSWORD }}
        run: |
          if [ -n "$APP_PASSWORD" ]; then
            cd apps/web && node build.mjs --password "$APP_PASSWORD"
          else
            npm run build:web
          fi

      - name: Build-Artefakte sichern (dist ist nicht Teil von master)
        run: |
          cp -r apps/web/dist /tmp/app-dist
          cp -r apps/web/assets /tmp/app-assets
          # public/ (Vorlagen-Galerie + Config-Bibliothek) für gh-pages sichern
          cp -r apps/web/public /tmp/app-public

      - name: Dateien auf gh-pages synchronisieren
        run: |
          # Dem Bot eine Identität für Git geben
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          # Zum gh-pages branch wechseln
          git checkout gh-pages

          # Aktuelle Quelldateien aus dem Hauptbranch holen
          # (index.html liegt in apps/web; die Root-config.json ist nach
          # packages/tools/config.json umgezogen — die Web-App nutzt
          # public/configs/standard.json als Standard)
          git checkout master -- apps/web/index.html
          if git cat-file -e master:config.json 2>/dev/null; then
            git checkout master -- config.json
          fi
          mv apps/web/index.html index.html && rm -rf apps/web 2>/dev/null || true

          # Gebaute Dateien aus dem Job übernehmen (vor dem Branch-Wechsel gesichert)
          rm -rf assets dist public
          cp -r /tmp/app-assets assets
          cp -r /tmp/app-dist dist
          cp -r /tmp/app-public public

          # Prüfen, ob sich die Dateien überhaupt verändert haben
          git add -A index.html config.json assets dist public
          if git diff --staged --quiet; then
            echo "Keine Änderungen zu synchronisieren."
          else
            git commit -m "Automatisches Update von index.html, config.json, assets und dist"
            git push origin gh-pages
          fi
