name: Vorlagen & Config auf GitHub Pages synchronisieren

# Änderungen an Vorlagen (Templates) und Konfigurationen landen automatisch
# auf der GitHub-Pages-Seite — ohne manuellen Eingriff.
#
# Der eigentliche Pages-Update (Bundle, Assets, public/) passiert in
# sync-pages.yml — dieser Workflow ergänzt gezielt die Inhalte, die dort
# nicht überwacht werden: Vorlagen-Galerie, gespeicherte Configs und
# die Root-config.json.

on:
  push:
    branches:
      - master
    paths:
      # Vorlagen-Galerie der Web-App (Manifest + PNGs)
      - "packages/web/public/templates/**"
      # Gespeicherte Konfigurationen (Config-Bibliothek)
      - "packages/web/public/configs/**"
      # Root-config.json (CLI + Standard-Config)
      - "config.json"
      # Dieses Workflow-File selbst
      - ".github/workflows/sync-pages-templates.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  sync-templates:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout Code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0 # Alle Branches laden, damit gh-pages ausgecheckt werden kann

      - name: Identität für den Sync-Bot
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Vorlagen & Configs auf gh-pages übernehmen
        run: |
          git checkout gh-pages

          sync_dir () {
            # $1 = Quellpfad auf master, $2 = Zielpfad auf gh-pages
            # Staging-Kopie statt direkt verschieben — vermeidet
            # checkout-Überbleibsel als Duplikate im Tree.
            rm -rf "$2"
            mkdir -p /tmp/sync-stage/"$(basename "$2")"
            git checkout master -- "$1"
            mv "$1"/* /tmp/sync-stage/"$(basename "$2")"/
            mkdir -p "$2"
            mv /tmp/sync-stage/"$(basename "$2")"/* "$2"/
          }

          # Vorlagen-Galerie: Manifest + PNGs (aus der Web-App)
          if git cat-file -e master:packages/web/public/templates/templates.json 2>/dev/null; then
            sync_dir packages/web/public/templates public/templates
          fi

          # Gespeicherte Configs (Config-Bibliothek)
          if git ls-tree -d master:packages/web/public/configs >/dev/null 2>&1; then
            sync_dir packages/web/public/configs public/configs
          fi

          # Root-config.json (wird von index.html und CLI gleichermaßen genutzt)
          if git cat-file -e master:config.json 2>/dev/null; then
            git checkout master -- config.json
          fi

          # Aufräumen: checkout-Überbleibsel + Altlasten früherer Läufe
          # entfernen (packages/web/index.html-Kopie, public/compare des
          # entfernten Pixelvergleich-Tools)
          rm -rf packages
          rm -f packages/web/index.html 2>/dev/null || true
          rm -rf public/compare 2>/dev/null || true

      - name: Änderungen committen und pushen
        run: |
          # -A: auch Löschungen müssen gestaged werden
          git add -A
          if git diff --staged --quiet; then
            echo "Keine Vorlagen-/Config-Änderungen zu synchronisieren."
          else
            git commit -m "Vorlagen & Configs von master synchronisiert (auto)"
            git push origin gh-pages
          fi
