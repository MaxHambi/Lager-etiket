name: CI

# Lint (oxlint/oxfmt), vitest, Build (obuild) und TypeDoc — pnpm-basiert,
# analog zum etiket-Repo (pnpm/action-setup + setup-node mit pnpm-Cache).
on:
  push:
    branches:
      - master
      - main
  pull_request:
    branches:
      - master
      - main
  # Manueller Start über die GitHub-Weboberfläche möglich
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: Lint (oxlint + oxfmt)
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      - name: pnpm installieren
        uses: pnpm/action-setup@v4

      - name: Node.js einrichten
        uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: "pnpm"

      - name: Abhängigkeiten installieren
        run: pnpm install --frozen-lockfile

      - name: oxlint + oxfmt ausführen
        run: pnpm lint

  test:
    name: Unit-Tests (vitest)
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      - name: pnpm installieren
        uses: pnpm/action-setup@v4

      - name: Node.js einrichten
        uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: "pnpm"

      - name: Abhängigkeiten installieren
        run: pnpm install --frozen-lockfile

      - name: Tests ausführen (vitest, alle Pakete)
        run: pnpm test

  build:
    name: Build (Typecheck + obuild + Web-Bundle)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      - name: pnpm installieren
        uses: pnpm/action-setup@v4

      - name: Node.js einrichten
        uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: "pnpm"

      - name: Abhängigkeiten installieren
        run: pnpm install --frozen-lockfile

      - name: Typecheck aller Pakete
        run: pnpm typecheck

      - name: Build aller Pakete (obuild + esbuild)
        run: pnpm build

      - name: Build-Artefakt hochladen (7 Tage aufbewahren)
        uses: actions/upload-artifact@v6
        with:
          name: app-bundle
          path: packages/web/dist/app.js
          retention-days: 7

  docs:
    name: Docs (TypeDoc-Referenz)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      - name: pnpm installieren
        uses: pnpm/action-setup@v4

      - name: Node.js einrichten
        uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: "pnpm"

      - name: Abhängigkeiten installieren
        run: pnpm install --frozen-lockfile

      - name: Modul-Referenz generieren
        run: |
          pnpm --filter @lager-etiket/web run gen-vault 2>/dev/null || node scripts/gen-vault-stub.mjs
          pnpm exec typedoc

      - name: Modul-Referenz hochladen (7 Tage aufbewahren)
        uses: actions/upload-artifact@v6
        with:
          name: api-docs
          path: docs/api
          retention-days: 7
