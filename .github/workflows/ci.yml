name: CI

# Lint, Unit-Tests und Build bei jedem Push und jedem Pull Request
on:
  push:
    branches:
      - master
      - main
  pull_request:
    branches:
      - master
      - main
  # Manueller Start über die GitHub-Weboberfläche möglich
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: Lint (ESLint)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      - name: Node.js einrichten
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: 'npm'

      - name: Abhängigkeiten installieren
        run: npm ci --no-audit --no-fund

      - name: ESLint ausführen
        run: npm run lint

  test:
    name: Unit-Tests (node:test)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      - name: Node.js einrichten
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: 'npm'

      - name: Abhängigkeiten installieren
        run: npm ci --no-audit --no-fund

      - name: Unit-Tests ausführen
        run: npm test

  build:
    name: Build (Typecheck + Bundle)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      - name: Node.js einrichten
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: 'npm'

      - name: Abhängigkeiten installieren
        run: npm ci --no-audit --no-fund

      - name: Typecheck + esbuild-Bundle
        run: npm run build

      - name: Build-Artefakt hochladen (7 Tage aufbewahren)
        uses: actions/upload-artifact@v5
        with:
          name: app-bundle
          path: dist/app.js
          retention-days: 7
