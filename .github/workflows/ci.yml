name: CI

# Lint, Unit-Tests, Build und Docs bei jedem Push und jedem Pull Request.
# Turbo orchestriert die Tasks über alle Workspaces (apps/*, packages/*)
# und cacht sie inkrementell.
on:
  push:
    branches:
      - master
      - main
  pull_request:
    branches:
      - master
      - main
  # Manueller Start über die GitHub-Weboberfläche möglich
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: Lint (ESLint, alle Workspaces)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      - name: Node.js einrichten
        uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: "npm"

      - name: Abhängigkeiten installieren
        run: npm ci --no-audit --no-fund

      - name: ESLint ausführen (turbo run lint)
        run: npm run lint

  test:
    name: Unit-Tests (node:test)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      - name: Node.js einrichten
        uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: "npm"

      - name: Abhängigkeiten installieren
        run: npm ci --no-audit --no-fund

      - name: Unit-Tests ausführen (turbo run test)
        run: npm test

  build:
    name: Build (Typecheck + Bundle)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      - name: Node.js einrichten
        uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: "npm"

      - name: Abhängigkeiten installieren
        run: npm ci --no-audit --no-fund

      # Turbos Remote-Cache beschleunigt CI-Läufe; ohne Token läuft alles lokal.
      - name: Turbo Remote Cache aktivieren (falls Token vorhanden)
        run: echo "TURBO_TOKEN=${{ secrets.TURBO_TOKEN }}" >> $GITHUB_ENV
        continue-on-error: true

      - name: Build aller Workspaces (turbo run build)
        run: npm run build

      - name: Build-Artefakt hochladen (7 Tage aufbewahren)
        uses: actions/upload-artifact@v6
        with:
          name: app-bundle
          path: apps/web/dist/app.js
          retention-days: 7

  docs:
    name: Docs (TypeDoc-Referenz)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      - name: Node.js einrichten
        uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: "npm"

      - name: Abhängigkeiten installieren
        run: npm ci --no-audit --no-fund

      - name: Modul-Referenz generieren
        run: |
          node scripts/gen-vault-stub.mjs
          npx typedoc

      - name: Modul-Referenz hochladen (7 Tage aufbewahren)
        uses: actions/upload-artifact@v6
        with:
          name: api-docs
          path: docs/api
          retention-days: 7
